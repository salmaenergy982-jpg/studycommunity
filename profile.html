<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCommunity — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>

<div class="app" id="appScreen">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">StudyCommunity</span>
    </div>
    <nav class="topnav">
      <a href="index.html">Session</a>
      <a href="profile.html" class="active">Profile</a>
      <a href="rooms.html">Rooms</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="topbar-right">
      <div class="streak-pill" id="streakPill">
        <span class="flame">🔥</span>
        <span id="streakCount">0</span>
        <span class="streak-label">days</span>
      </div>
      <button class="ctrl-btn logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="profile-header-card">
        <img id="avatarImg" class="profile-avatar" src="https://api.dicebear.com/7.x/shapes/svg?seed=default" alt="Profile picture">
        <div class="profile-info">
          <h1 id="profileUsername">Loading…</h1>
          <p id="profileEmail" class="profile-email"></p>
          <p class="profile-joined" id="profileJoined"></p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number" id="statStreak">0</span>
          <span class="stat-label">Day streak</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statSessions">0</span>
          <span class="stat-label">Sessions completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statMinutes">0</span>
          <span class="stat-label">Minutes focused</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statHours">0</span>
          <span class="stat-label">Hours focused</span>
        </div>
      </div>

      <div class="panel-head" style="margin-top: 48px;">
        <p class="eyebrow">This week</p>
        <h2>Your activity</h2>
      </div>
      <div class="streak-card">
        <div class="streak-week" id="streakWeek"></div>
        <p class="streak-note">Days you completed at least one focus session.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>StudyCommunity — built to help you study smarter, not longer.</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="profile.js"></script>
</body>
</html>
