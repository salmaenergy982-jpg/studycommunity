<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCommunity — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>

<div class="app" id="appScreen">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">StudyCommunity</span>
    </div>
    <nav class="topnav">
      <a href="index.html">Session</a>
      <a href="profile.html">Profile</a>
      <a href="rooms.html">Rooms</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>
    <div class="topbar-right">
      <div class="streak-pill" id="streakPill">
        <span class="flame">🔥</span>
        <span id="streakCount">0</span>
        <span class="streak-label">days</span>
      </div>
      <button class="ctrl-btn logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <p class="eyebrow">Your account</p>
        <h2>Settings</h2>
      </div>

      <div class="todo-card" style="max-width: 560px;">
        <h3 class="settings-section-title">Profile picture</h3>
        <div class="settings-avatar-row">
          <img id="avatarPreview" class="profile-avatar small" src="https://api.dicebear.com/7.x/shapes/svg?seed=default">
          <input type="file" id="avatarInput" accept="image/*" style="display:none">
          <button class="ctrl-btn" onclick="document.getElementById('avatarInput').click()">Choose image</button>
        </div>

        <h3 class="settings-section-title">Username</h3>
        <input type="text" id="usernameInput" class="auth-input" placeholder="Your username">
        <button class="ctrl-btn primary" onclick="saveUsername()">Save username</button>

        <h3 class="settings-section-title">Change password</h3>
        <input type="password" id="newPassword" class="auth-input" placeholder="New password (min. 6 characters)">
        <button class="ctrl-btn primary" onclick="changePassword()">Update password</button>

        <p class="auth-error" id="settingsError"></p>
        <p class="auth-success" id="settingsSuccess"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>StudyCommunity — built to help you study smarter, not longer.</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="settings.js"></script>
</body>
</html>
